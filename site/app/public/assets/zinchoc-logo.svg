<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Zin Choc heart and eye mark">
  <!-- Vector recreation of the Zin Choc heart-and-eye logo supplied by the owner:
       an asymmetric ink-navy heart holding a wide-open eye; the iris peeks from
       beneath the upper lid with a white ring inside it. -->
  <defs>
    <clipPath id="zc-eye">
      <path d="M25 91
               C 48 66, 82 58, 104 60
               C 132 62, 160 72, 177 88
               C 166 112, 136 130, 102 130
               C 68 130, 40 114, 25 91 Z"/>
    </clipPath>
  </defs>
  <!-- Asymmetric heart, right lobe taller -->
  <path fill="#1D3241"
    d="M100 187
       C 60 152, 22 120, 16 78
       C 12 47, 31 26, 57 26
       C 77 26, 92 39, 99 54
       C 105 33, 124 13, 150 13
       C 177 13, 193 38, 188 74
       C 182 120, 140 155, 100 187 Z"/>
  <!-- Inner contour highlight -->
  <path fill="none" stroke="#3E5A70" stroke-width="2" stroke-linecap="round"
    d="M23 80 C 19 51, 35 32, 58 32 C 76 32, 89 44, 96 58 M107 50 C 114 32, 130 19, 149 19 C 172 19, 186 40, 182 72 C 177 114, 139 148, 103 179"/>
  <!-- Sclera: wide open eye -->
  <path fill="#FFFFFF"
    d="M25 91
       C 48 66, 82 58, 104 60
       C 132 62, 160 72, 177 88
       C 166 112, 136 130, 102 130
       C 68 130, 40 114, 25 91 Z"/>
  <g clip-path="url(#zc-eye)">
    <!-- Iris: large circle cropped by the upper lid -->
    <circle cx="101" cy="82" r="32" fill="#1D3241"/>
    <!-- White ring inside the iris -->
    <circle cx="101" cy="86" r="18" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>
